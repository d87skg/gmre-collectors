name: High Frequency Crypto & Market

on:
  schedule:
    - cron: '17 */2 * * *'  # 每2小时的17分跑一次，避开整点拥堵
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect_micro:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas requests lxml html5lib curl_cffi cme-fedwatch python-dotenv yfinance

      - name: Run High-Freq Collectors
        env:
          BGEOMETRICS_TOKEN: ${{ secrets.BGEOMETRICS_TOKEN }}
          GMRE_PROXY_BASE: ${{ secrets.GMRE_PROXY_BASE }}
        run: |
          mkdir -p data/
          python collectors/yahoo_market.py || echo "Yahoo failed"
          python collectors/bgeometrics_onchain.py || echo "BGeometrics failed"
          python collectors/deribit_skew.py || echo "Deribit skew failed"
          python collectors/deribit_dvol.py || echo "Deribit DVOL failed"
          python collectors/deribit_perp.py || echo "Deribit perp failed"
          python collectors/hyperliquid_depth.py || echo "HL depth failed"
          python collectors/hyperliquid_mark.py || echo "HL mark failed"
          python collectors/binance_sentiment.py || echo "Binance sentiment failed"
          python collectors/us_institution.py || echo "US inst failed"
          python collectors/farside_etf.py || echo "Farside BTC failed"
          python collectors/farside_eth_etf.py || echo "Farside ETH failed"
          python collectors/blockchain_com.py || echo "Blockchain failed"
          python collectors/fear_greed.py || echo "FearGreed failed"
          python collectors/okx_funding.py || echo "OKX funding failed"
          python collectors/okx_oi.py || echo "OKX OI failed"
          python collectors/okx_liquidation.py || echo "OKX liq failed"
          python collectors/defillama_stablecoin.py || echo "DefiLlama failed"
          python collectors/coingecko_global.py || echo "CG global failed"
          python collectors/coingecko_stablecoins.py || echo "CG stables failed"
          python collectors/coingecko_exchange_vol.py || echo "CG exvol failed"
          python collectors/coingecko_derivatives.py || echo "CG derivatives failed"
          python collectors/lme_commodity.py || echo "LME failed"

      - name: Notify Feishu & Snapshot
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: |
          python collectors/notify_feishu.py || echo "Feishu push failed"

      - name: Commit data to main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          if git diff --staged --quiet; then
            echo "No changes, skipping commit"
          else
            git commit -m "highfreq data: $(date -u +%Y-%m-%dT%H:%M)"
            # 核心修复：先拉取远程最新的代码，再推送到 main，彻底告别推送到副分支的烦恼
            git pull --rebase origin main || echo "Pull failed"
            git push origin HEAD:main || echo "Push to main failed"
          fi