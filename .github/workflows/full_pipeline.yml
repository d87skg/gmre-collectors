name: Full Cloud Engine (Backup)

on:
  schedule:
    # 每天 UTC 0/8/16 点（结算后 15 分）执行，避开并发高峰
    - cron: '15 0,8,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas numpy requests python-dotenv yfinance scikit-learn scipy statsmodels

      - name: Build Cloud DB and Run Pipeline
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          GMRE_PROXY_BASE: ${{ secrets.GMRE_PROXY_BASE }}
        run: |
          mkdir -p data
          
          cat << 'EOF' > cloud_setup.py
          import sqlite3
          import pandas as pd
          import os
          import requests
          import io
          from datetime import datetime

          # 1. 建表（包含全量需要的表）
          con = sqlite3.connect('data/macro.db')
          con.execute('CREATE TABLE IF NOT EXISTS observations (series_id TEXT, timestamp TEXT, value REAL, source TEXT, retrieved_at TEXT)')
          con.execute('CREATE TABLE IF NOT EXISTS daily_summary (asof_date TEXT PRIMARY KEY, risk_gate TEXT, stress_state TEXT, frag_level TEXT)')
          con.execute('CREATE TABLE IF NOT EXISTS caps_engine (asof_date TEXT, symbol TEXT, caps_score REAL, PRIMARY KEY(asof_date, symbol))')
          con.execute('CREATE TABLE IF NOT EXISTS lti_engine (asof_date TEXT PRIMARY KEY, lti_score REAL, level TEXT)')
          con.execute('CREATE TABLE IF NOT EXISTS commodity_caps (date TEXT, symbol TEXT, open_interest REAL, warehouse_stock REAL, close_price REAL, PRIMARY KEY (date, symbol))')
          con.execute('CREATE TABLE IF NOT EXISTS san_metrics (datetime TEXT, metric TEXT, slug TEXT, value REAL)')
          con.commit()
          con.close()

          # 2. 加载宏观历史锚点
          if os.path.exists('data/history_anchor.csv'):
              df = pd.read_csv('data/history_anchor.csv')
              conn = sqlite3.connect('data/macro.db')
              df.to_sql('observations', conn, if_exists='append', index=False)
              conn.close()
              print(f'✅ 宏观锚点已加载 ({len(df)} 条)')
              
          # 3. 加载商品历史锚点（彻底解决 CAPS 为 N/A 的问题）
          if os.path.exists('data/commodity_anchor.csv'):
              df_comm = pd.read_csv('data/commodity_anchor.csv')
              conn = sqlite3.connect('data/macro.db')
              df_comm.to_sql('commodity_caps', conn, if_exists='append', index=False)
              conn.close()
              print(f'✅ 商品锚点已加载 ({len(df_comm)} 条)')
          else:
              print('❌ 未找到 commodity_anchor.csv，CAPS 将降级为空')

          # 4. 白嫖高频账号的最新快照
          urls = [
              "https://raw.githubusercontent.com/jmhbldj/gmre-collectors/data-highfreq/data/feishu_snapshot.csv",
              "https://raw.githubusercontent.com/d87skg/gmre-collectors/main/data/feishu_snapshot.csv"
          ]
          for url in urls:
              try:
                  r = requests.get(f"{url}?t={datetime.now().timestamp()}", timeout=10)
                  if r.status_code == 200 and r.text.strip():
                      df_tmp = pd.read_csv(io.StringIO(r.text))
                      conn = sqlite3.connect('data/macro.db')
                      df_tmp.to_sql('feishu_snapshot', conn, if_exists='replace', index=False)
                      conn.close()
                      print(f'✅ 成功拉取线上数据: {url.split("/")[-3]}')
                      break
              except Exception as e:
                  print(f'⚠️ 拉取失败 ({url}): {str(e)[:30]}')
          EOF
          
          python cloud_setup.py
          
          # 5. 跑外盘商品同步、覆写、分位
          python tools/sync_commodity_github.py || echo "Commodity failed"
          python tools/apply_feishu_override.py || echo "Override failed"
          python tools/compute_percentile.py || echo "Percentile failed"
          
          # 6. 核心修复：计算 CAPS 和 LTI 并把结果落表
          python engines_v3/caps_engine.py || echo "CAPS failed"
          python engines_v3/lti_engine.py || echo "LTI failed"
          
          # 7. 运行主引擎并推飞书
          python engines_v3/run_v4.py || echo "Engine failed"
          python tools/send_local_feishu.py || echo "Feishu failed"