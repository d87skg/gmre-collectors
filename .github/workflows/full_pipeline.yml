name: Full Cloud Engine (Disaster Recovery)

on:
  workflow_dispatch:  # 手动触发

permissions:
  contents: write

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas numpy requests python-dotenv yfinance scikit-learn scipy statsmodels pyyaml

      - name: Fetch Real DB Snapshot
        run: |
          git fetch origin db-sync
          if git show-ref --verify --quiet refs/remotes/origin/db-sync; then
            git show origin/db-sync:data/macro.db > data/macro.db
            echo "✅ 成功拉取本地最新完整数据库 macro.db (大小: $(du -h data/macro.db | cut -f1))"
          else
            echo "❌ 找不到灾备数据库，请先在本地执行 backup_to_github.py"
            exit 1
          fi

      - name: Run Cloud Engine & Push
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          GMRE_PROXY_BASE: ${{ secrets.GMRE_PROXY_BASE }}
        run: |
          # 🚨 [DISABLED] 彻底废除飞书文本反解析
          # python tools/sync_feishu_snapshot.py || echo "Sync failed"
          # python tools/apply_feishu_override.py || echo "Override failed"
          
          python tools/compute_percentile.py || echo "Percentile failed"
          python tools/sync_commodity_github.py || echo "Commodity failed"
          python engines_v3/spread_engine.py || echo "Spread failed"
          python engines_v3/caps_engine.py || echo "CAPS failed"
          python engines_v3/lti_engine.py || echo "LTI failed"
          python engines_v3/run_v4.py || echo "Engine failed"
          python tools/send_local_feishu.py || echo "Feishu failed"