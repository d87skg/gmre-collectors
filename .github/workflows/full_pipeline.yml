name: Full Cloud Engine (Backup)

on:
  schedule:
    - cron: '15 0,8,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        # 👈 核心修复：加入了 pyyaml 用于解析事件日历
        run: pip install pandas numpy requests python-dotenv yfinance scikit-learn scipy statsmodels pyyaml

      - name: Build Cloud DB and Run Pipeline
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          GMRE_PROXY_BASE: ${{ secrets.GMRE_PROXY_BASE }}
        run: |
          mkdir -p data
          
          cat << 'EOF' > cloud_init.py
          import sqlite3
          con = sqlite3.connect('data/macro.db')
          con.execute('CREATE TABLE IF NOT EXISTS observations (series_id TEXT, timestamp TEXT, value REAL, source TEXT, retrieved_at TEXT)')
          con.execute('CREATE TABLE IF NOT EXISTS daily_summary (asof_date TEXT PRIMARY KEY, risk_gate TEXT, stress_state TEXT, frag_level TEXT)')
          con.execute('CREATE TABLE IF NOT EXISTS caps_engine (asof_date TEXT, symbol TEXT, caps_score REAL, oi_stock_ratio REAL, stock_percentile REAL, PRIMARY KEY(asof_date, symbol))')
          con.execute('CREATE TABLE IF NOT EXISTS lti_engine (asof_date TEXT PRIMARY KEY, lti_score REAL, level TEXT)')
          con.execute('CREATE TABLE IF NOT EXISTS commodity_caps (date TEXT, symbol TEXT, open_interest REAL, warehouse_stock REAL, close_price REAL, PRIMARY KEY (date, symbol))')
          con.execute('CREATE TABLE IF NOT EXISTS san_metrics (datetime TEXT, metric TEXT, slug TEXT, value REAL)')
          # 👈 核心修复：强制建快照表，防止下游崩溃
          con.execute('CREATE TABLE IF NOT EXISTS feishu_snapshot (timestamp TEXT PRIMARY KEY)')
          con.commit()
          con.close()
          print("✅ 云端空数据库初始化完成")
          EOF
          python cloud_init.py
          
          cat << 'EOF' > load_anchors.py
          import sqlite3
          import pandas as pd
          import os
          
          con = sqlite3.connect('data/macro.db')
          
          if os.path.exists('data/history_anchor.csv'):
              df = pd.read_csv('data/history_anchor.csv')
              df.to_sql('observations', con, if_exists='append', index=False)
              print(f'✅ 宏观锚点已加载 ({len(df)} 条)')
              
          if os.path.exists('data/commodity_anchor.csv'):
              df_comm = pd.read_csv('data/commodity_anchor.csv')
              df_comm.to_sql('commodity_caps', con, if_exists='append', index=False)
              print(f'✅ 商品锚点已加载 ({len(df_comm)} 条)')
          else:
              print('❌ 未找到 commodity_anchor.csv，CAPS 将降级为空')
          con.close()
          EOF
          python load_anchors.py
          
          python tools/sync_feishu_snapshot.py || echo "Sync failed"
          python tools/apply_feishu_override.py || echo "Override failed"
          python tools/compute_percentile.py || echo "Percentile failed"
          python tools/sync_commodity_github.py || echo "Commodity failed"
          python engines_v3/spread_engine.py || echo "Spread failed"
          python engines_v3/caps_engine.py || echo "CAPS failed"
          python engines_v3/lti_engine.py || echo "LTI failed"
          python engines_v3/run_v4.py || echo "Engine failed"
          python tools/send_local_feishu.py || echo "Feishu failed"