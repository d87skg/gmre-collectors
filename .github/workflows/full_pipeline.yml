name: Full Cloud Engine (Backup)

on:
  schedule:
    - cron: '0 4 * * *'  # 每天 UTC 04:00 (北京 12:00)，错开本地 9:00 的计算
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas numpy requests python-dotenv yfinance

      - name: Build Cloud DB and Run Pipeline
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          GMRE_PROXY_BASE: ${{ secrets.GMRE_PROXY_BASE }}
        run: |
          mkdir -p data
          # 1. 初始化空的云端 SQLite 数据库（跳过不存在表报错）
          python -c "import sqlite3; con=sqlite3.connect('data/macro.db'); con.execute('CREATE TABLE IF NOT EXISTS observations (series_id TEXT, timestamp TEXT, value REAL, source TEXT, retrieved_at TEXT)'); con.execute('CREATE TABLE IF NOT EXISTS feishu_snapshot (timestamp TEXT PRIMARY KEY)'); con.execute('CREATE TABLE IF NOT EXISTS daily_summary (asof_date TEXT PRIMARY KEY, risk_gate TEXT, stress_state TEXT, frag_level TEXT)'); con.commit(); con.close()"
          
          # 2. 跑同步和熔断（吃进刚才采集的 CSV）
          python tools/sync_feishu_snapshot.py || echo "Sync failed"
          python tools/apply_feishu_override.py || echo "Override failed"
          
          # 3. 算分位（因为云端是全新库，数据太少会自动降级）
          python tools/compute_percentile.py || echo "Percentile failed"
          
          # 4. 运行主引擎
          python engines_v3/run_v4.py || echo "Engine failed"
          
          # 5. 推送到手机飞书
          python tools/send_local_feishu.py || echo "Feishu failed"