name: Low Frequency Macro

on:
  schedule:
    - cron: '15 0 * * *'  # UTC 00:15 (北京 08:15)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect_macro:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas requests lxml html5lib python-dotenv

      - name: Run Low-Freq Collectors
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GMRE_PROXY_BASE: ${{ secrets.GMRE_PROXY_BASE }}
        run: |
          mkdir -p data/
          python collectors/fred_macro.py || echo "FRED failed"
          python collectors/cftc_socrata.py || echo "CFTC failed"
          python collectors/bis_cbpol.py || echo "BIS failed"
          python collectors/ecb_rates.py || echo "ECB failed"
          python collectors/eurostat_hicp.py || echo "Eurostat failed"
          python collectors/boj_rates.py || echo "BOJ failed"
          python collectors/nyfed_rates.py || echo "NY Fed failed"
          python collectors/treasury_tga.py || echo "TGA failed"
          python collectors/worldbank_reserves.py || echo "WorldBank failed"

      - name: Commit data to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          if git diff --staged --quiet; then
            echo "No changes, skipping commit"
          else
            git commit -m "lowfreq data: $(date -u +%Y-%m-%d)"
            git push || echo "Push failed"
          fi