name: Collect Data

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pandas requests lxml html5lib

      - name: Run collectors
        run: |
          mkdir -p data/
          python collectors/cftc_cot.py || echo "CFTC 失败"
          python collectors/farside_etf.py || echo "Farside 失败"

      - name: List data
        run: ls -la data/

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          if git diff --staged --quiet; then
            echo "无变化，跳过 commit"
          else
            git commit -m "data: $(date -u +%Y-%m-%d)"
            git push || echo "push 失败"
          fi