name: Collect Data

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install pandas requests lxml html5lib curl_cffi cme-fedwatch

      - name: Run collectors
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          mkdir -p data/
          python collectors/cftc_cot.py || echo "CFTC failed"
          python collectors/cftc_fx.py || echo "CFTC FX failed"
          python collectors/farside_etf.py || echo "Farside failed"
          python collectors/deribit_dvol.py || echo "Deribit DVOL failed"
          python collectors/deribit_perp.py || echo "Deribit perp failed"
          python collectors/blockchain_com.py || echo "Blockchain failed"
          python collectors/fear_greed.py || echo "FearGreed failed"
          python collectors/fetch_fedwatch.py || echo "CME failed"
          python collectors/okx_funding.py || echo "OKX funding failed"
          python collectors/okx_oi.py || echo "OKX OI failed"
          python collectors/okx_liquidation.py || echo "OKX liq failed"
          python collectors/nyfed_rates.py || echo "NYFed failed"
          python collectors/fred_macro.py || echo "FRED failed"
          python collectors/defillama_stablecoin.py || echo "DefiLlama failed"

      - name: List data
        run: ls -la data/

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          if git diff --staged --quiet; then
            echo "no change, skip commit"
          else
            git commit -m "data: $(date -u +%Y-%m-%d)"
            git push || echo "push failed"
          fi

      - name: Notify Feishu
        if: always()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        run: |
          pip install pandas requests
          python collectors/notify_feishu.py